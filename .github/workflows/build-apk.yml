name: Build Ngechat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name=ngechat .

      - name: Add Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")

          if not settings.exists():
              settings = Path("android/settings.gradle")
              app = Path("android/app/build.gradle")

          if not settings.exists() or not app.exists():
              raise SystemExit("File Gradle Android tidak ditemukan")

          s = settings.read_text()
          a = app.read_text()

          if settings.suffix == ".kts":
              settings_plugin = (
                  '    id("com.google.gms.google-services") '
                  'version "4.4.2" apply false\n'
              )
              app_plugin = (
                  '    id("com.google.gms.google-services")\n'
              )
          else:
              settings_plugin = (
                  '    id "com.google.gms.google-services" '
                  'version "4.4.2" apply false\n'
              )
              app_plugin = (
                  '    id "com.google.gms.google-services"\n'
              )

          if "com.google.gms.google-services" not in s:
              if "plugins {" not in s:
                  raise SystemExit("Blok plugins tidak ditemukan di settings")
              s = s.replace(
                  "plugins {",
                  "plugins {\n" + settings_plugin,
                  1
              )

          if "com.google.gms.google-services" not in a:
              if "plugins {" not in a:
                  raise SystemExit("Blok plugins tidak ditemukan di app Gradle")
              a = a.replace(
                  "plugins {",
                  "plugins {\n" + app_plugin,
                  1
              )

          settings.write_text(s)
          app.write_text(a)
          print("Konfigurasi Firebase Android berhasil ditambahkan")
          PY

      - name: Get dependencies
        run: |
          flutter pub add firebase_core
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ngechat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
