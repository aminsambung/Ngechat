name: Build Ngechat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check Firebase configuration
        run: |
          test -f google-services.json || {
            echo "ERROR: google-services.json tidak ditemukan di root repository."
            exit 1
          }

      - name: Add Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings_kts = Path("android/settings.gradle.kts")
          app_kts = Path("android/app/build.gradle.kts")

          settings_groovy = Path("android/settings.gradle")
          app_groovy = Path("android/app/build.gradle")

          if settings_kts.exists() and app_kts.exists():
              settings = settings_kts
              app = app_kts
              is_kts = True
          elif settings_groovy.exists() and app_groovy.exists():
              settings = settings_groovy
              app = app_groovy
              is_kts = False
          else:
              raise SystemExit(
                  "File Gradle Android tidak ditemukan."
              )

          settings_text = settings.read_text()
          app_text = app.read_text()

          if is_kts:
              settings_plugin = (
                  '    id("com.google.gms.google-services") '
                  'version "4.4.2" apply false\n'
              )

              app_plugin = (
                  '    id("com.google.gms.google-services")\n'
              )
          else:
              settings_plugin = (
                  '    id "com.google.gms.google-services" '
                  'version "4.4.2" apply false\n'
              )

              app_plugin = (
                  '    id "com.google.gms.google-services"\n'
              )

          if "com.google.gms.google-services" not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  "plugins {\n" + settings_plugin,
                  1,
              )

          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  "plugins {\n" + app_plugin,
                  1,
              )

          settings.write_text(settings_text)
          app.write_text(app_text)

          print("Firebase Gradle plugin berhasil dipasang.")
          PY

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ngechat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
